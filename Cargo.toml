[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
spectra-core = { path = "crates/core" }
spectra-dsp = { path = "crates/dsp" }
spectra-sources = { path = "crates/sources" }
anyhow = "1"
crossbeam-channel = "0.5"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ron = "0.12"
dirs = "7"
eframe = "0.36.2"
egui = "0.36.2"
egui_dock = "0.21.1"
seify = { version = "0.26.2", default-features = false }
tempfile = "3"
rfd = "0.18"
